<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="APTITUDE RPG – Gamified aptitude learning. Study for placement exams like playing an RPG. Earn XP, level up, maintain streaks, and battle bosses. 100% offline, zero installation." />
  <meta name="keywords" content="aptitude, RPG, placement, GATE, CAT, gamified, quiz, offline, study" />
  <meta name="author" content="Aptitude RPG" />
  <title>APTITUDE RPG ⚔️ - Level Up Your Mind</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>" />

  <!-- Google Fonts: Inter + Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN (no build step needed) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone — lets us write JSX directly in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Canvas Confetti — achievement & level-up celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <!-- Tailwind theme config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'Outfit', 'sans-serif'] }
        }
      }
    }
  </script>

  <!-- App CSS -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="text-gray-100 min-h-screen font-sans antialiased">

  <!-- React Root Mount Point -->
  <div id="root"></div>

  <!--
    Load order matters:
      1. data.js   — All static game data (questions, nodes, achievements, quests, shop)
      2. sound.js  — Web Audio API synthesizer (depends on nothing)
      3. app.js    — React app (depends on data.js + sound.js)
  -->
  <script src="data.js"></script>
  <script src="sound.js"></script>
  <script type="text/babel" src="app.js"></script>

</body>
</html>
